{% extends "base.html" %}

{% block title %}Đăng nhập – HASC VN{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
  <div class="card">
    <h2 style="margin-bottom: 1.5rem; text-align: center;">Đăng nhập hệ thống</h2>

    {% if error %}
    <div class="alert alert--error" role="alert" data-toast="error">
      {{ error }}
    </div>
    {% endif %}

    {% if message %}
    <div class="alert alert--success" role="status" data-toast="success">
      {{ message }}
    </div>
    {% endif %}

    <form method="post" action="/login" data-loading="Đang đăng nhập...">
      <div class="form-field">
        <label for="username">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username" value="{{ username or '' }}" />
      </div>

      <div class="form-field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Đăng nhập</button>
    </form>
    <p style="text-align: center; margin: 1rem 0 0;"><a href="/forgot-password">Quên mật khẩu?</a></p>
  </div>
</div>
{% endblock %}
