{% extends "base.html" %}

{% block title %}Đổi mật khẩu – HASC VN{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <h2 style="margin-bottom: 0.75rem; text-align: center;">Đổi mật khẩu</h2>
    <p style="color: var(--color-muted); font-size: 0.95rem; margin-bottom: 1.5rem; text-align: center;">
      Bạn đang sử dụng mật khẩu tạm thời. Vui lòng đổi mật khẩu mới để tiếp tục sử dụng hệ thống.
    </p>

    {% if error %}
    <div class="alert alert--error" role="alert" data-toast="error">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/change-password" data-loading="Đang đổi mật khẩu...">
      <div class="form-field">
        <label for="old_password">Mật khẩu hiện tại</label>
        <input type="password" id="old_password" name="old_password" required autocomplete="current-password" />
      </div>

      <div class="form-field">
        <label for="new_password">Mật khẩu mới</label>
        <input type="password" id="new_password" name="new_password" required autocomplete="new-password" />
      </div>

      <div class="form-field">
        <label for="confirm_password">Xác nhận mật khẩu mới</label>
        <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password" />
      </div>

      <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Lưu mật khẩu mới</button>
    </form>
  </div>
</div>
{% endblock %}
