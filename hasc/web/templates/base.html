<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}HASC VN{% endblock %}</title>
    <link rel="icon" type="image/webp" href="/static/img/logo.webp" />
    <link rel="stylesheet" href="/static/css/app.css?v={{ css_version }}" />
    <!-- htmx is optional: every form below also works as a plain POST without it. -->
    <script src="/static/js/htmx.min.js" defer></script>
    <script src="/static/js/ui.js?v={{ css_version }}" defer></script>
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Bỏ qua, đến nội dung chính</a>
    {% block body %}
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/" aria-label="HASC VN – Trang chủ">
          <img src="/static/img/logo.webp" alt="HASC VN" width="240" height="119" />
        </a>
        <nav class="site-nav" aria-label="Điều hướng chính">
          {% block nav %}
          {% if user %}
          <a href="/account">Tài khoản</a>
          <a href="/logout">Đăng xuất</a>
          {% endif %}
          {% endblock %}
        </nav>
      </div>
    </header>

    <main class="container" id="main" tabindex="-1">
      {% block frame %}
      {% block content %}{% endblock %}
      {% endblock %}
    </main>
    {% endblock %}
  </body>
</html>
