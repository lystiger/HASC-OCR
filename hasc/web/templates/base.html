<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}HASC VN{% endblock %}</title>
    <link rel="icon" type="image/webp" href="/static/img/logo.webp" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <!-- htmx is optional: every form below also works as a plain POST without it. -->
    <script src="/static/js/htmx.min.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="/" aria-label="HASC VN – Trang chủ">
          <img src="/static/img/logo.webp" alt="HASC VN" width="240" height="119" />
        </a>
        <nav class="site-nav" aria-label="Điều hướng chính">
          {% block nav %}{% endblock %}
        </nav>
      </div>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
