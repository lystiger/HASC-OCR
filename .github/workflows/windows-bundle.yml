name: Windows bundle

# Builds the USB bundle for the office PC, installs it on a clean Windows runner and checks that the
# website and worker run. On a version tag the zip is attached to the GitHub release.
# It takes about 10 minutes, so pull requests run it only when they touch the installer or the
# packages it bundles; every version tag runs it in full before the release gets its zip.
# The unit tests run on Windows in the CI workflow, so this one does not repeat them.
on:
  pull_request:
    paths:
      - "windows/**"
      - "requirements.txt"
      # Python the installer and the services run on their own, outside the unit tests' view
      - "hasc/db/migrations.py"
      - "hasc/db/migrations/**"
      - "hasc/certs.py"
      - "hasc/web/redirect.py"
      - "scripts/create_user.py"
      - ".github/workflows/windows-bundle.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build and test-install the bundle
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the bundle
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          "VERSION=$version" >> $env:GITHUB_ENV
          .\windows\build_bundle.ps1 -Version $version -OutDir "$env:RUNNER_TEMP\dist"

      - name: Unpack the bundle
        shell: pwsh
        run: |
          Expand-Archive "$env:RUNNER_TEMP\dist\hasc-$env:VERSION-win64.zip" "$env:RUNNER_TEMP\bundle"
          # The bundled Python must load the app and its packages; the install step then runs it as services.
          & "$env:RUNNER_TEMP\bundle\python\python.exe" -c "import sys; sys.path.insert(0, r'$env:RUNNER_TEMP\bundle\HASC-OCR'); import hasc.web.app, hasc.worker.jobs, hasc.certs, hasc.web.redirect, openpyxl, PIL"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install, update, delete and reinstall as on the office PC (Windows PowerShell 5.1)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $b = "$env:RUNNER_TEMP\bundle"
          $zip = "$env:RUNNER_TEMP\dist\hasc-$env:VERSION-win64.zip"
          function Check([string]$what, [bool]$ok) { if (-not $ok) { throw "FAILED: $what" } ; Write-Host "ok: $what" }
          function Run([scriptblock]$block) { & $block; if ($LASTEXITCODE) { throw "exit code $LASTEXITCODE" } }
          [Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          function Login([string]$pass) {
            $r = Invoke-WebRequest "https://127.0.0.1/api/login" -Method Post -UseBasicParsing -SessionVariable s `
              -ContentType "application/json" -Body ('{"username": "admin", "password": "' + $pass + '"}')
            $script:web = $s
            return $r.StatusCode
          }
          function Fetch([string]$url) {
            # One request, redirects not followed; returns the status, Location and the TLS certificate's issuer.
            $q = [Net.HttpWebRequest]::Create($url)
            $q.AllowAutoRedirect = $false
            try { $r = $q.GetResponse() } catch [Net.WebException] { $r = $_.Exception.Response; if (-not $r) { throw } }
            $out = @{ Status = [int]$r.StatusCode; Location = $r.Headers["Location"]; Issuer = $null }
            if ($q.ServicePoint.Certificate) { $out.Issuer = $q.ServicePoint.Certificate.Issuer }
            $r.Close()
            return $out
          }
          function CheckFirewall([string]$when) {
            $ports = @((Get-NetFirewallRule -DisplayName "HASC website" | Get-NetFirewallPortFilter).LocalPort)
            Check "${when}: firewall opens 443 and 8080 ($($ports -join ','))" (($ports -contains "443") -and ($ports -contains "8080"))
          }
          function CheckHttps([string]$when) {
            # Criterion 18: HTTPS with a certificate from the authority the installer made and trusted,
            # port 8080 only redirecting, and the authority downloadable for phones.
            $page = Fetch "https://127.0.0.1/login"
            Check "${when}: https://127.0.0.1/login answers over TLS from the HASC authority ($($page.Status), $($page.Issuer))" (($page.Status -eq 200) -and ($page.Issuer -eq "CN=HASC local CA"))
            $plain = Fetch "http://127.0.0.1:8080/login?next=x"
            Check "${when}: http://127.0.0.1:8080/login redirects to HTTPS ($($plain.Status) $($plain.Location))" (($plain.Status -eq 308) -and ($plain.Location -eq "https://127.0.0.1/login?next=x"))
            Invoke-WebRequest "http://127.0.0.1:8080/ca.crt" -UseBasicParsing -OutFile "$env:RUNNER_TEMP\ca.crt"
            $ca = New-Object Security.Cryptography.X509Certificates.X509Certificate2 "$env:RUNNER_TEMP\ca.crt"
            Check "${when}: /ca.crt is the authority this PC trusts ($($ca.Subject))" (($ca.Subject -eq "CN=HASC local CA") -and (Test-Path "Cert:\LocalMachine\Root\$($ca.Thumbprint)"))
          }
          '{"customers": {}, "products": {}}' | Set-Content "$env:RUNNER_TEMP\known_names.json"
          $pw = ConvertTo-SecureString "Ci-Pw-$(Get-Random)-Aa1!" -AsPlainText -Force
          $key = ConvertTo-SecureString "sk-or-ci-dummy" -AsPlainText -Force

          # 0. The office PC's real path: v1.0.3 (HTTP on 8080, two services) updated by its own update.ps1.
          gh release download v1.0.3 --repo $env:GITHUB_REPOSITORY --pattern "hasc-v1.0.3-win64.zip" --dir "$env:RUNNER_TEMP\old"
          if ($LASTEXITCODE) { throw "downloading v1.0.3 failed" }
          Expand-Archive "$env:RUNNER_TEMP\old\hasc-v1.0.3-win64.zip" "$env:RUNNER_TEMP\old\bundle"
          Run { & "$env:RUNNER_TEMP\old\bundle\install.ps1" -NonInteractive -SkipKeyExport -FreshStart -HascPassword $pw -OpenRouterKey $key `
            -KnownNames "$env:RUNNER_TEMP\known_names.json" -AdminPassword "ci-old-pass" -Subnet "10.0.0.0/8" }
          $old = Invoke-WebRequest "http://127.0.0.1:8080/api/login" -Method Post -UseBasicParsing `
            -ContentType "application/json" -Body '{"username": "admin", "password": "ci-old-pass"}'
          Check "v1.0.3 runs on plain HTTP" ($old.StatusCode -eq 200)
          Run { & C:\HASC\tools\update.ps1 -NonInteractive -ZipPath $zip -HascPassword $pw }
          Check "admin from v1.0.3 logs in over HTTPS after the update" ((Login "ci-old-pass") -eq 200)
          CheckHttps "update from v1.0.3"
          CheckFirewall "update from v1.0.3"
          Check "firewall addresses kept from v1.0.3" (((Get-NetFirewallRule -DisplayName "HASC website" | Get-NetFirewallAddressFilter).RemoteAddress -join ",") -match "^10\.0\.0\.0/")
          Run { & C:\HASC\tools\delete.ps1 -NonInteractive -EraseData }
          Check "C:\HASC removed after the v1.0.3 round" (-not (Test-Path C:\HASC))

          # 1. First install.
          Run { & "$b\install.ps1" -NonInteractive -SkipKeyExport -FreshStart -HascPassword $pw -OpenRouterKey $key `
            -KnownNames "$env:RUNNER_TEMP\known_names.json" -AdminPassword "ci-admin-pass" -Subnet "10.0.0.0/8" }
          Check "admin can log in" ((Login "ci-admin-pass") -eq 200)
          CheckHttps "fresh install"
          CheckFirewall "fresh install"
          # The first admin's password is temporary: set a real one, then the account list shows it as the owner.
          Invoke-WebRequest "https://127.0.0.1/api/password" -Method Post -UseBasicParsing -WebSession $web `
            -ContentType "application/json" -Body '{"old": "ci-admin-pass", "new": "ci-admin-pass-2"}' | Out-Null
          Check "admin logs in with the new password" ((Login "ci-admin-pass-2") -eq 200)
          $accounts = (Invoke-WebRequest "https://127.0.0.1/api/admin/users" -UseBasicParsing -WebSession $web).Content | ConvertFrom-Json
          $listed = $accounts | ForEach-Object { $_ } | Where-Object { $_.username -eq "admin" } | Select-Object -First 1
          Check "fresh install makes admin the owner" ([bool]$listed.is_owner)
          # cipher /c lists "E hasc.db" when encrypted, then the accounts that can decrypt it.
          $efs = cipher /c C:\HASC\data\hasc.db | Out-String
          Check "database encrypted to hasc" ($efs -cmatch '(?ms)^E hasc\.db.*Users who can decrypt:\s+(\S+\\)?hasc\b')
          Check "tools installed" (Test-Path C:\HASC\tools\delete.ps1)
          # Job C: the daily check task exists, and a run writes the latest release for the admins' banner.
          Check "update check task registered" ([bool](Get-ScheduledTask -TaskName "HASC update check" -ErrorAction SilentlyContinue))
          $task = Get-ScheduledTask -TaskName "HASC update check"
          Check "update check runs as SYSTEM, at startup and daily ($($task.Principal.UserId), $($task.Triggers.Count) triggers)" (($task.Principal.UserId -eq "SYSTEM") -and ($task.Triggers.Count -eq 2))
          # Save the check's token as HASC update does (DPAPI LocalMachine), then run the real task as SYSTEM.
          Add-Type -AssemblyName System.Security
          $blob = [Security.Cryptography.ProtectedData]::Protect([Text.Encoding]::UTF8.GetBytes($env:GH_TOKEN), $null, "LocalMachine")
          Set-Content C:\HASC\tools\github-token-check.dat -Value ([Convert]::ToBase64String($blob)) -Encoding ASCII
          Remove-Item C:\HASC\tools\update-status.json -Force -ErrorAction SilentlyContinue
          Start-ScheduledTask -TaskName "HASC update check"
          for ($i = 0; $i -lt 60 -and -not (Test-Path C:\HASC\tools\update-status.json); $i++) { Start-Sleep -Seconds 2 }
          for ($i = 0; $i -lt 30 -and (Get-ScheduledTask -TaskName "HASC update check").State -eq "Running"; $i++) { Start-Sleep -Seconds 2 }
          $result = (Get-ScheduledTaskInfo -TaskName "HASC update check").LastTaskResult
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          $upd = Get-Content C:\HASC\tools\update-status.json -Raw | ConvertFrom-Json
          Check "update check task (SYSTEM) found the latest release (result $result, $($upd.latest), installed $($upd.installed), error $($upd.error))" (($result -eq 0) -and ($upd.latest -eq $latest) -and $upd.available -and -not $upd.error)
          $office = (Invoke-WebRequest "https://127.0.0.1/office" -UseBasicParsing -WebSession $web).Content
          Check "admins see the update banner" ($office -match [regex]::Escape("phi$([char]0x00EA)n b$([char]0x1EA3)n m$([char]0x1EDB)i $latest"))
          $version = (Get-Content C:\HASC\VERSION.txt -Raw).Trim()
          $raw = Get-Content C:\HASC\tools\update-status.json -Raw
          Check "status file names the installed version as text ($version)" ($raw -match ('"installed":\s*"' + [regex]::Escape($version) + '"'))
          Check "the banner shows the installed version" ($office -match [regex]::Escape("($([char]0x0111)ang d$([char]0x00F9)ng $version)"))
          $caBefore = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -eq "CN=HASC local CA" }).Thumbprint

          # 2. Update from a local zip through update.ps1, and ask GitHub for the latest release.
          Run { & C:\HASC\tools\update.ps1 -NonInteractive -ZipPath $zip -HascPassword $pw }
          Check "admin can log in after the update" ((Login "ci-admin-pass-2") -eq 200)
          CheckHttps "after the update"
          CheckFirewall "after the update"
          $caAfter = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -eq "CN=HASC local CA" }).Thumbprint
          Check "the update keeps the authority phones trust" ($caBefore -and ($caAfter -eq $caBefore))
          Check "database backed up before the update" ([bool](Get-ChildItem C:\HASC\data\backups\before-* -Directory -ErrorAction SilentlyContinue))
          # HASC update refreshes the banner itself: once the installer's run is over, a check started by
          # update.ps1 must write a newer checked_at. Compared as text: both are UTC round-trip ("o") times.
          for ($i = 0; $i -lt 60 -and (Get-ScheduledTask -TaskName "HASC update check").State -eq "Running"; $i++) { Start-Sleep -Seconds 2 }
          $before = (Get-Date).ToUniversalTime().ToString("o")
          Run { & C:\HASC\tools\update.ps1 -NonInteractive -CheckOnly -Token $env:GH_TOKEN }
          $checked = ""
          for ($i = 0; $i -lt 60 -and -not ($checked -gt $before); $i++) {
              Start-Sleep -Seconds 2
              if ((Get-Content C:\HASC\tools\update-status.json -Raw -ErrorAction SilentlyContinue) -match '"checked_at":\s*"([^"]+)"') { $checked = $Matches[1] }
          }
          Check "HASC update runs the update check (checked $checked, after $before)" ($checked -gt $before)

          # 2b. Setting up the Zalo bot on an existing install adds the hasc-zalo service. The token is fake, so
          # getMe fails: the install still succeeds, and the receiver keeps running and retrying (P152).
          $zaloToken = ConvertTo-SecureString "ci-fake-zalo-token" -AsPlainText -Force
          Run { & "$b\install.ps1" -NonInteractive -Yes -SkipKeyExport -HascPassword $pw -ZaloToken $zaloToken `
            -ZaloSenderIds "u-ci-sender" -ZaloSummaryChatId "g-ci-group" }
          Check "hasc-zalo service installed" ([bool](Get-Service hasc-zalo -ErrorAction SilentlyContinue))
          $efs = cipher /c C:\HASC\config\zalo.env | Out-String
          Check "zalo.env encrypted to hasc" ($efs -cmatch '(?ms)^E zalo\.env.*Users who can decrypt:\s+(\S+\\)?hasc\b')
          Check "zalo.env draft removed" (-not (Test-Path C:\HASC\logs\zalo.env.new))
          $zaloEnvExtra = (& C:\HASC\bin\nssm.exe get hasc-zalo AppEnvironmentExtra | Out-String) -replace "\0", ""
          Check "hasc-zalo logs in UTF-8 ($zaloEnvExtra)" ($zaloEnvExtra -match "PYTHONUTF8=1")
          $zaloLog = ""
          for ($i = 0; $i -lt 30 -and -not ($zaloLog -match "Error: getMe"); $i++) { Start-Sleep -Seconds 2; $zaloLog = Get-Content C:\HASC\logs\zalo.log -Raw -Encoding UTF8 -ErrorAction SilentlyContinue }
          Check "receiver logged the failed check" ($zaloLog -match "Error: getMe")
          Check "no encoding error in the receiver log" (-not ($zaloLog -match "UnicodeEncodeError"))
          Check "the log never holds the token" (-not ($zaloLog -match "ci-fake-zalo-token"))
          Check "receiver keeps running after a failed check ($((Get-Service hasc-zalo).Status))" ((Get-Service hasc-zalo).Status -eq "Running")
          Check "admin can log in with the Zalo bot set up" ((Login "ci-admin-pass-2") -eq 200)
          # The receiver's Vietnamese messages need PYTHONUTF8 when stdout is a file, as under NSSM.
          function PrintVietnamese([string]$utf8) {
              $env:PYTHONUTF8 = $utf8
              $p = Start-Process C:\HASC\python\python.exe -ArgumentList '-c "print(chr(0x1EBF))"' -NoNewWindow -Wait -PassThru `
                -RedirectStandardOutput "$env:RUNNER_TEMP\vi.out" -RedirectStandardError "$env:RUNNER_TEMP\vi.err"
              Remove-Item Env:PYTHONUTF8 -ErrorAction SilentlyContinue
              return $p.ExitCode
          }
          Check "without PYTHONUTF8, printing Vietnamese to a file fails (control)" ((PrintVietnamese "0") -ne 0)
          Check "with PYTHONUTF8=1, printing Vietnamese to a file works" ((PrintVietnamese "1") -eq 0)
          # An update keeps the Zalo settings and the service.
          $zaloStamp = (Get-Item C:\HASC\config\zalo.env).LastWriteTimeUtc
          Run { & C:\HASC\tools\update.ps1 -NonInteractive -ZipPath $zip -HascPassword $pw }
          Check "update keeps zalo.env" ((Get-Item C:\HASC\config\zalo.env).LastWriteTimeUtc -eq $zaloStamp)
          Check "update keeps hasc-zalo running ($((Get-Service hasc-zalo).Status))" ((Get-Service hasc-zalo).Status -eq "Running")
          Check "admin can log in after updating with the Zalo bot" ((Login "ci-admin-pass-2") -eq 200)

          # 3. Delete refuses a backup folder inside C:\HASC (it would be deleted with it), then deletes keeping the data.
          & C:\HASC\tools\delete.ps1 -NonInteractive -HascPassword $pw -KeepDataTo C:\HASC\keep
          Check "delete refuses a backup inside C:\HASC" (($LASTEXITCODE -ne 0) -and (Test-Path C:\HASC\data\hasc.db) -and ((Get-Service hasc-web).Status -eq "Running"))
          Run { & C:\HASC\tools\delete.ps1 -NonInteractive -HascPassword $pw -KeepDataTo C:\hasc-keep }
          Check "services removed" (-not (Get-Service hasc-web -ErrorAction SilentlyContinue))
          Check "account removed" (-not (Get-LocalUser hasc -ErrorAction SilentlyContinue))
          Check "C:\HASC removed" (-not (Test-Path C:\HASC))
          Check "firewall rule removed" (-not (Get-NetFirewallRule -DisplayName "HASC website" -ErrorAction SilentlyContinue))
          Check "HASC authority no longer trusted" (-not (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -eq "CN=HASC local CA" }))
          Check "hasc-redirect service removed" (-not (Get-Service hasc-redirect -ErrorAction SilentlyContinue))
          Check "update check task removed" (-not (Get-ScheduledTask -TaskName "HASC update check" -ErrorAction SilentlyContinue))
          Check "profile removed, or a startup task will remove it" ((-not (Get-CimInstance Win32_UserProfile | Where-Object { $_.LocalPath -like "*\hasc" })) -or [bool](Get-ScheduledTask -TaskName "HASC remove profile *" -ErrorAction SilentlyContinue))
          $users = & "$b\python\python.exe" -c "import sqlite3; print(sqlite3.connect(r'C:\hasc-keep\hasc.db').execute('select count(*) from users').fetchone()[0])"
          Check "kept database readable by an administrator ($users users)" ([int]$users -ge 1)

          # 4. Reinstall from the kept data: the old admin password still works.
          $pw2 = ConvertTo-SecureString "Ci-Pw-$(Get-Random)-Bb2!" -AsPlainText -Force
          Run { & "$b\install.ps1" -NonInteractive -SkipKeyExport -HascPassword $pw2 -OpenRouterKey $key `
            -KnownNames "$env:RUNNER_TEMP\known_names.json" -ImportDb C:\hasc-keep\hasc.db -ImportPhotos C:\hasc-keep\photos -Subnet "10.0.0.0/8" }
          Check "kept admin password works after reinstall" ((Login "ci-admin-pass-2") -eq 200)
          CheckHttps "reinstall from kept data"

          # 5. Delete and erase the data.
          Run { & C:\HASC\tools\delete.ps1 -NonInteractive -EraseData }
          Check "C:\HASC removed after erase" (-not (Test-Path C:\HASC))
          Check "account removed after erase" (-not (Get-LocalUser hasc -ErrorAction SilentlyContinue))

      - name: Show permissions
        if: failure()
        shell: powershell
        run: |
          whoami /groups /fo list | Select-String "Group Name|Attributes"
          icacls C:\HASC
          icacls C:\HASC\python
          icacls C:\HASC\python\python.exe
          Get-Item C:\HASC\python\python.exe -Stream * | Select-Object Stream

      - name: Show service logs
        if: always()
        shell: pwsh
        run: Get-ChildItem C:\HASC\logs\*.log -ErrorAction SilentlyContinue | ForEach-Object { "--- $_"; Get-Content $_ -Tail 40 }

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: hasc-${{ env.VERSION }}-win64
          path: ${{ runner.temp }}/dist/hasc-${{ env.VERSION }}-win64.zip


  release:
    name: Attach the bundle to the release
    needs: bundle
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hasc-${{ github.ref_name }}-win64
      - name: Create the release and upload the zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes "Windows bundle: unzip, then double-click install.cmd. Installed PCs update with the HASC update shortcut."
          sha256sum "hasc-$TAG-win64.zip" > "hasc-$TAG-win64.zip.sha256"
          gh release upload "$TAG" "hasc-$TAG-win64.zip" "hasc-$TAG-win64.zip.sha256" --repo "$GITHUB_REPOSITORY" --clobber
